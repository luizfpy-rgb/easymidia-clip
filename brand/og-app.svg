<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B1B52"/>
      <stop offset="1" stop-color="#120C22"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.26" cy="0.5" r="0.62">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="cutTop">
      <polygon points="0,0 1024,0 1024,330 0,700"/>
    </clipPath>
    <clipPath id="cutBottom">
      <polygon points="0,742 1024,372 1024,1024 0,1024"/>
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- play fatiado (mesmas formas do avatar.svg) -->
  <g transform="translate(60,75) scale(0.47)">
    <g clip-path="url(#cutTop)">
      <path d="M 350 262 L 350 762 L 742 512 Z" fill="#FFFFFF"
            stroke="#FFFFFF" stroke-width="56" stroke-linejoin="round"/>
    </g>
    <g clip-path="url(#cutBottom)">
      <path d="M 384 296 L 384 796 L 776 546 Z" fill="#A78BFA"
            stroke="#A78BFA" stroke-width="56" stroke-linejoin="round"/>
    </g>
  </g>

  <text x="540" y="290" font-family="Space Grotesk" font-weight="700" font-size="80" fill="#FFFFFF">easymidia <tspan fill="#A78BFA">clip</tspan></text>
  <text x="540" y="362" font-family="Space Grotesk" font-weight="500" font-size="40" fill="#C9C2DE">Shorts com IA, publicados</text>
  <text x="540" y="414" font-family="Space Grotesk" font-weight="500" font-size="40" fill="#C9C2DE">no automático</text>
  <rect x="540" y="458" width="120" height="8" rx="4" fill="#7C3AED"/>
  <text x="540" y="540" font-family="Space Grotesk" font-weight="500" font-size="32" fill="#8F86AD">www.easymidia.io</text>
</svg>
